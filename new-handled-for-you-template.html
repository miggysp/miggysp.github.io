<script>
/* =====================================================================
   REPORT DATA
   Everything that changes from brand to brand lives in this block.
   Edit the values below, save, and refresh the page in your browser.

   What's filled in: only real information. The brand details you gave
   (Nemat, October 2026), Merz's 7-day standard for fixing problems,
   Merz's three sales channels, and the KPI labels and "The story this
   month" text from Merz's current report. Everything else is blank ("") for
   you to fill in.

   How blanks behave
   - Every section, card, row and column from the original layout is
     kept. Anything left blank ("") shows as a gray dash on the page.
   - To add an item, copy a { ... } block, paste it below, and fill it
     in. Keep the comma between items.

   Field notes
   - problems: showStandard: true adds "Merz standard: 7 days" under the
     result. Use it for anything that was fixed; leave it false for
     things that never became a problem (like a stockout avoided).
   - history.years: one entry per year, oldest first. Set inProgress:
     true on the current year. Each row's values list goes in the same
     order as the years, e.g. values: ["3", "7", "10"].
   - The "Average days to fix" row compares each year to the standard
     and labels it Beats / Meets / Above standard automatically. If a
     year is above standard, explain why in history.explain.
   ===================================================================== */
window.REPORT = {

  brand: {
    name: "Nemat",
    pageTitle: "Nemat Handled For You",    // also update the <title> line at the very top
    reportMonth: "October 2026",
    partnerSince: "",
    accountLead: ""
  },

  merz: {
    standardDays: 7                        // Merz's standard for fixing a problem
  },

  summary: {
    lede: "",
    hero:   { label: "Estimated sales protected", value: "" },
    counts: [
      { label: "Tasks handled",   value: "" },
      { label: "Problems caught", value: "" }
    ]
  },

  problems: {
    aside: "",
    // Four problem cards, as in the original layout.
    // showStandard adds "Merz standard: 7 days" under the result.
    // showHistory shows the shaded "last time" line at the bottom of the card.
    items: [
      { dates: "", result: "", resultDetail: "", showStandard: true,  impact: { value: "", detail: "" }, title: "", happened: "", meant: "", fixed: "", showHistory: true,  history: { label: "", text: "" } },
      { dates: "", result: "", resultDetail: "", showStandard: true,  impact: { value: "", detail: "" }, title: "", happened: "", meant: "", fixed: "", showHistory: true,  history: { label: "", text: "" } },
      { dates: "", result: "", resultDetail: "", showStandard: false, impact: { value: "", detail: "" }, title: "", happened: "", meant: "", fixed: "", showHistory: true,  history: { label: "", text: "" } },
      { dates: "", result: "", resultDetail: "", showStandard: true,  impact: { value: "", detail: "" }, title: "", happened: "", meant: "", fixed: "", showHistory: false, history: { label: "", text: "" } }
    ],
    total: { label: "Total estimated sales protected this month", breakdown: "", value: "" },
    estimateNote: ""
  },

  // From Merz's current report. The five numbers were redacted in the
  // screenshot, so they are blank and show as a dash until filled in.
  overview: {
    kpis: [
      { label: "Total sales",   value: "" },
      { label: "Ordered units", value: "" },
      { label: "Avg retail",    value: "" },
      { label: "Page views",    value: "" },
      { label: "Conversion",    value: "" }
    ],
    title: "The story this month",
    subtitle: "What moved, and why",
    paragraphs: [
      "",
      "",
      "",
      ""
    ]
  },

  beforeAfter: {
    date: "",
    before: { title: "", rows: [ { name: "", meta: "" }, { name: "", meta: "" } ] },
    after:  { title: "", rows: [ { name: "", meta: "" } ] },
    note: ""
  },

  history: {
    // Six year columns, oldest first, as in the original layout.
    // inProgress: true on the current year gives it the dashed "in progress" style.
    years: [
      { year: "", note: "", milestone: "" },
      { year: "", note: "", milestone: "" },
      { year: "", note: "", milestone: "" },
      { year: "", note: "", milestone: "" },
      { year: "", note: "", milestone: "" },
      { year: "", note: "", milestone: "", inProgress: true }
    ],
    // One value per year, in the same order as the years above.
    rows: [
      { label: "Products on Amazon",            values: ["", "", "", "", "", ""] },
      { label: "Shopper reviews (total)",       values: ["", "", "", "", "", ""] },
      { label: "Problems caught",               values: ["", "", "", "", "", ""] },
      { label: "Average days to fix a problem", values: ["", "", "", "", "", ""], bars: true, useStandard: true },
      { label: "Days a product was sold out",   values: ["", "", "", "", "", ""], bars: true },
      { label: "Places you’re sold",            values: ["", "", "", "", "", ""] }
    ],
    explain: { title: "", text: "" },        // note box under the table, e.g. why a year was above standard
    note: "Places you’re sold: Amazon, Merz’s Chicago store on Lincoln Avenue, and Merz’s website."
  }
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;
    /* Site palette (same as the other report tabs) */
    --navy:#1a3150; --bar:#1a3150; --on-bar:#ffffff; --rule:#d9dfe8; --wash:#f1f3f7;
    --blue:#1a3150; --blue-2:#44536a; --blue-ink:#1a3150; --blue-tint:#f1f3f7;
    --gold:#b59a52; --gold-2:#d3bd7c; --gold-tint:#f1f3f7;
    --ink:#1c2a3d; --ink-2:#44536a; --ink-3:#6b7890; --line:#d9dfe8; --line-2:#d9dfe8; --paper:#ffffff; --page:#f1f3f7;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --deco:var(--sans);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --navy:#c6d5ec; --rule:#2a3649; --wash:#0c121c;
    --blue:#8fb0dc; --blue-2:#b6c0cf; --blue-ink:#c6d5ec; --blue-tint:#1a2433;
    --gold:#d3bd7c; --gold-2:#8a7a4c; --gold-tint:#1a2433;
    --ink:#e3e8f0; --ink-2:#b6c0cf; --ink-3:#8b97aa; --line:#2a3649; --line-2:#3a475c; --paper:#131b28; --page:#0c121c;
    color-scheme:dark;
  } }
  :root[data-theme="dark"]{
    --navy:#c6d5ec; --rule:#2a3649; --wash:#0c121c;
    --blue:#8fb0dc; --blue-2:#b6c0cf; --blue-ink:#c6d5ec; --blue-tint:#1a2433;
    --gold:#d3bd7c; --gold-2:#8a7a4c; --gold-tint:#1a2433;
    --ink:#e3e8f0; --ink-2:#b6c0cf; --ink-3:#8b97aa; --line:#2a3649; --line-2:#3a475c; --paper:#131b28; --page:#0c121c;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font:300 15px/1.65 var(--sans);padding:40px 16px 64px;-webkit-font-smoothing:antialiased}
  .sheet{max-width:980px;margin:0 auto;background:var(--paper);border:1px solid var(--line);padding:0 64px 48px;position:relative;overflow:hidden}
  
  .lbl{font:600 10.5px/1.3 var(--deco);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .n{font-variant-numeric:lining-nums tabular-nums}
  .dia{display:inline-block;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}

  /* Masthead */
  .mast{display:grid;grid-template-columns:170px 1fr;gap:40px;align-items:center;margin:0 -64px;padding:40px 64px 38px;background:var(--blue-ink);color:#fff;border-bottom:4px solid var(--gold-2)}
  .mast .copy{border-left:1px solid rgba(255,255,255,.28);padding-left:40px}
  .mast img{width:170px;height:auto;display:block}
  .mast .kicker{color:var(--gold-2);font-size:11px}
  .mast h1{font:500 38px/1.12 var(--serif);color:#fff;letter-spacing:-.01em;margin:10px 0 10px}
  .mast .when{display:flex;align-items:center;gap:12px;font-size:13.5px;color:rgba(255,255,255,.75)}
  .mast .when .dia{width:5px;height:5px;background:var(--gold-2)}

  /* Summary frame, after the logo's address box */
  .frame{position:relative;margin:40px 10px 64px;border:1px solid var(--blue);padding:28px 40px}
  .frame::before,.frame::after{content:"";position:absolute;top:50%;width:14px;height:14px;background:var(--paper);border:1px solid var(--blue);transform:translateY(-50%) rotate(45deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 8px var(--blue)}
  .frame::before{left:-8px} .frame::after{right:-8px}
  .frame .lede{font:400 21px/1.5 var(--serif);color:var(--blue-ink);text-align:center;max-width:680px;margin:0 auto}
  .counts{display:flex;justify-content:center;gap:0;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .counts div{text-align:center;padding:0 40px}
  .counts div + div{border-left:1px solid var(--gold-2)}
  .counts b{display:block;font:400 46px/1 var(--serif);color:var(--blue);margin-top:8px}
  .counts .hero b{font-size:58px;color:var(--blue-ink);margin-top:6px}
  .counts .hero .lbl{color:var(--blue)}
  .counts{align-items:flex-end}
  .total{display:flex;justify-content:space-between;align-items:center;gap:16px 32px;flex-wrap:nowrap;margin-top:6px;padding:22px 26px;background:var(--blue-ink);color:#fff}
  .total .lbl{color:var(--gold-2);font-size:11.5px}
  .total p{font-size:13.5px;color:rgba(255,255,255,.72);margin-top:4px}
  .total b{font:400 52px/1 var(--serif);font-variant-numeric:lining-nums;letter-spacing:-.01em}
  .track td.v .met sup{font-size:9px}
  .why{display:flex;gap:10px;margin-top:14px;padding:12px 16px;border-left:2px solid var(--gold-2);background:var(--blue-tint);font-size:13px;color:var(--ink-2)}
  .why b{font-weight:500;color:var(--blue-ink);white-space:nowrap}

  /* Section heads */
  .sec{margin-bottom:64px}
  .sec-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .sec-h .no{font:400 15px var(--serif);color:var(--gold)}
  .sec-h h2{font:500 25px/1.2 var(--serif);color:var(--blue-ink)}
  .sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-2),transparent)}
  .sec-h .aside{font-size:12.5px;color:var(--ink-3)}

  /* Problems */
  .prob{display:grid;grid-template-columns:190px 1fr;gap:32px;padding:26px 0;border-bottom:1px solid var(--line)}
  .prob:last-child{border-bottom:none}
  .prob .date{font-size:12.5px;color:var(--ink-3)}
  .prob .res{margin-top:10px;font:500 17px/1.3 var(--serif);color:var(--blue)}
  .prob .res small{display:block;font:300 12.5px var(--sans);color:var(--ink-3);margin-top:3px}
  .prob .std{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .impact{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .impact b{display:block;font:400 26px/1.1 var(--serif);color:var(--blue-ink);margin-top:6px;font-variant-numeric:lining-nums}
  .impact small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
  .est-note{font-size:12.5px;color:var(--ink-3);margin-top:14px}
  .prob h3{font:500 19px/1.3 var(--serif);color:var(--ink)}
  .wwh{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:14px}
  .wwh p{font-size:14.5px;color:var(--ink-2);margin-top:6px}
  .prev{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:5px 12px;background:var(--blue-tint);font-size:13px;color:var(--ink-2)}
  .prev .lbl{color:var(--blue)}

  /* Before / after */
  .ba{display:grid;grid-template-columns:1fr 44px 1fr;align-items:stretch;margin-top:18px}
  .ba .arrow{display:flex;align-items:center;justify-content:center}
  .ba .arrow span{width:9px;height:9px;border-top:1px solid var(--gold);border-right:1px solid var(--gold);transform:rotate(45deg)}
  .panel{padding:20px 22px;border:1px solid var(--line);background:var(--paper)}
  .panel.after{border-color:var(--blue);background:linear-gradient(var(--blue-tint),var(--blue-tint)) padding-box}
  .panel h3{font:500 18px/1.3 var(--serif);color:var(--blue-ink);margin:6px 0 14px}
  .page-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
  .page-row .n{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
  .panel.after .page-row{border-color:#d3dfeb}
  .panel.after .page-row .n{color:var(--blue);font-weight:500}
  .ba-note{margin-top:14px;font-size:14px;color:var(--ink-2)}

  /* Track record */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:18px}
  table.track{width:100%;border-collapse:collapse;min-width:760px}
  .track th,.track td{padding:12px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
  .track thead th{font:400 22px/1 var(--serif);color:var(--blue-ink);padding-top:6px;border-bottom:none}
  .track thead th small{display:block;font:300 11.5px var(--sans);color:var(--ink-3);margin-top:6px}
  .track thead th.now{color:var(--gold)}
  .track .rowh{padding-left:0;width:175px;font:500 13px/1.4 var(--sans);color:var(--ink-2);position:sticky;left:0;background:var(--paper);z-index:1}
  .track tr.axis td{padding:0 12px;height:24px;border-bottom:none;position:relative}
  .track tr.axis td:not(.rowh)::before{content:"";position:absolute;left:0;right:0;top:11px;height:1px;background:var(--gold-2)}
  .track tr.axis td:not(.rowh)::after{content:"";position:absolute;left:13px;top:7px;width:8px;height:8px;background:var(--blue);transform:rotate(45deg)}
  .track tr.axis td.now::before{background:repeating-linear-gradient(90deg,var(--gold-2) 0 3px,transparent 3px 7px)}
  .track tr.axis td.now::after{background:var(--paper);border:1px solid var(--gold)}
  .track tr.mile td{font:400 14px/1.4 var(--serif);color:var(--blue-ink)}
  .track td.v{font-size:14.5px;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
  .track td.v.best{color:var(--blue);font-weight:600}
  .track td.v .bar{height:3px;background:var(--gold-2);margin-top:8px}
  .meter{position:relative;margin-top:8px;height:3px}
  .meter .bar{margin-top:0 !important;position:relative;z-index:1}
  .track td.v .met{display:block;font:300 11px/1.3 var(--sans);color:var(--ink-3);margin-top:6px}
  .track td.v.best .met{color:var(--blue)}
  .track .rowh small{display:block;font-weight:300;font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
  .track td.v.best .bar{background:var(--blue)}
  .track tbody tr:last-child td,.track tbody tr:last-child th{border-bottom:none}
  .track-note{font-size:12.5px;color:var(--ink-3);margin-top:12px}

  /* Routine work */
  .quiet{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid var(--line)}
  .quiet div{padding:18px 18px 0 0}
  .quiet div + div{padding-left:18px;border-left:1px solid var(--line)}
  .quiet b{display:block;font:500 15px var(--serif);color:var(--blue-ink)}
  .quiet .big{display:block;font:400 32px/1.15 var(--serif);color:var(--blue);margin:6px 0 4px}
  .quiet p{font-size:13.5px;color:var(--ink-2)}

  footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
  footer .sig{display:flex;align-items:center;gap:10px;font:400 15px var(--serif);color:var(--blue-ink)}

  @media (max-width:760px){
    body{padding:0}
    .sheet{border:none;padding:0 18px 36px}
    .mast{grid-template-columns:1fr;gap:18px;margin:0 -18px;padding:28px 18px 26px}
    .mast img{width:130px}
    .mast .copy{border-left:none;padding-left:0;border-top:1px solid rgba(255,255,255,.28);padding-top:16px}
    .mast h1{font-size:27px}
    .mast .when{flex-wrap:wrap;gap:4px 10px;font-size:12.5px}
    .frame{margin:28px 6px 48px;padding:22px 18px}
    .frame .lede{font-size:18px}
    .counts div{padding:0 16px}
    .counts .lbl{white-space:nowrap;letter-spacing:.12em}
    .mast .when .dia{display:none}
    .mast .when{flex-direction:column;align-items:flex-start}
    .counts b{font-size:38px}
    .counts{flex-wrap:wrap;row-gap:18px}
    .counts .hero{flex-basis:100%;border-bottom:1px solid var(--line);padding-bottom:16px}
    .counts .hero b{font-size:46px}
    .counts .hero + div{border-left:none}
    .total{padding:18px;flex-wrap:wrap}
    .total b{font-size:40px}
    .why{flex-direction:column;gap:2px}
    .prob{grid-template-columns:1fr;gap:4px}
    .prob{grid-template-columns:1fr auto !important;gap:4px 10px !important}
    .prob .side{display:contents}
    .prob .date{order:1}
    .prob .res{order:2;text-align:right}
    .prob .std{order:3;grid-column:1/-1;text-align:right;margin-top:0}
    .prob > div:not(.side){order:4;grid-column:1/-1;margin-top:6px}
    .impact{order:5;grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-top:8px;padding:10px 0 4px}
    .impact .lbl{flex-basis:100%}
    .impact b{font-size:22px;margin-top:0}
    .impact small{margin-top:0}
    .prob .res{margin-top:0;font-size:15px;text-align:right}
    .prob .res small{display:none}
    .wwh{grid-template-columns:1fr;gap:10px}
    .prev{display:flex;flex-wrap:wrap}
    .ba{grid-template-columns:1fr}
    .ba .arrow{height:32px}
    .ba .arrow span{transform:rotate(135deg)}
    .quiet{grid-template-columns:1fr 1fr}
    .quiet div:nth-child(3){padding-left:0;border-left:none}
    .quiet div:nth-child(n+3){border-top:1px solid var(--line);margin-top:16px}
    .track .rowh{width:120px}
    .sec-h .aside{display:none}
  }
</style>
<style>
  [hidden]{display:none!important}
  .blank{color:var(--ink-3);opacity:.6;font-weight:300}
  .lede[hidden] + .counts{border-top:none;margin-top:0;padding-top:0}

  /* This month's numbers + story */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--blue);border-bottom:1px solid var(--line)}
  .kpis div{padding:16px 16px 18px 0}
  .kpis div + div{padding-left:16px;border-left:1px solid var(--line)}
  .kpis b{display:block;font:400 28px/1.1 var(--serif);color:var(--blue-ink);margin-top:8px;font-variant-numeric:lining-nums tabular-nums}
  .kpis b.empty{color:var(--ink-3);font-size:20px}
  .story{margin-top:24px;max-width:720px}
  .story p{font-size:15.5px;line-height:1.7;color:var(--ink-2)}
  .story p + p{margin-top:14px}
  .story p:first-child{font:400 18px/1.6 var(--serif);color:var(--blue-ink)}
  @media (max-width:760px){
    .kpis{grid-template-columns:1fr 1fr}
    .kpis div,.kpis div + div{padding:14px 12px 14px 0;border-left:none;border-top:1px solid var(--line)}
    .kpis div:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
    .kpis div:nth-child(-n+2){border-top:none}
    .kpis div:last-child:nth-child(odd){grid-column:1/-1}
    .story p:first-child{font-size:16.5px}
  }

  /* ===== Site style: same frame, type and colours as the other report tabs ===== */
  body{margin:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--wash);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  .sheet{max-width:760px;margin:0 auto;background:var(--paper);border:none;padding:48px 56px 56px;overflow:visible}
  .topbar{background:var(--bar);color:var(--on-bar);text-align:center;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .brand{text-align:center;background:var(--bar);border-bottom:3px solid var(--gold);margin:-48px -56px 40px;padding:44px 24px 26px}
  .brand .logo{display:block;width:280px;max-width:80%;height:auto;margin:0 auto 18px}
  .brand .report{font-family:var(--serif);color:var(--on-bar);font-size:19px;letter-spacing:.02em}
  .brand .report i{color:#c9d3e2}
  .brand .since{margin-top:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a9b6c9}
  .brand .since .blank{border-color:rgba(255,255,255,.35)}

  /* Blank values: an empty underline, as on the other tabs */
  .blank{display:inline-block;min-width:60px;height:1.1em;border-bottom:1px solid var(--rule);color:transparent;opacity:1;font-weight:400;vertical-align:-0.15em;overflow:hidden}

  /* Labels */
  .lbl{font:600 11px/1.35 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .n{font-variant-numeric:lining-nums tabular-nums}
  .dia{background:var(--gold)}

  /* Section heads: serif title with a plain subtitle underneath */
  .sec{margin:56px 0 0}
  .frame + .sec{margin-top:8px}
  .sec-h{display:block;margin-bottom:20px}
  .sec-h .no,.sec-h .rule{display:none}
  .sec-h h2{font:600 30px/1.15 var(--serif);color:var(--navy);text-wrap:balance;font-variant-numeric:lining-nums}
  .sec-h .aside{display:block;margin-top:6px;font-size:16px;color:var(--ink-2)}

  /* Summary frame */
  .frame{margin:0 8px 56px;border:1px solid var(--navy);padding:26px 32px}
  .frame::before,.frame::after{background:var(--paper);border-color:var(--navy);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 8px var(--navy)}
  .frame .lede{font:500 22px/1.45 var(--serif);color:var(--navy)}
  .counts{border-top:1px solid var(--rule)}
  .counts div{padding:0 28px}
  .counts div + div{border-left:1px solid var(--rule)}
  .counts b{font:600 38px/1.05 var(--serif);color:var(--navy)}
  .counts .hero b{font-size:48px;color:var(--navy)}
  .counts .hero .lbl{color:var(--gold)}

  /* Ledger rows (KPI strip) */
  .kpis{border-top:2px solid var(--blue);border-bottom:1px solid var(--rule)}
  .kpis div + div{border-left:1px solid var(--rule)}
  .kpis b{font:600 30px/1.1 var(--serif);color:var(--navy)}
  .story p{font-size:16px;line-height:1.6;color:var(--ink-2)}
  .story p:first-child{font:500 21px/1.5 var(--serif);color:var(--navy)}

  /* Problems caught */
  .prob{grid-template-columns:170px 1fr;gap:28px;border-bottom:1px solid var(--rule)}
  .prob:first-of-type{border-top:2px solid var(--blue)}
  .prob .date{font-size:13px;color:var(--ink-3)}
  .prob .res{font:600 20px/1.25 var(--serif);color:var(--navy)}
  .prob .res small{font:400 13px var(--sans)}
  .prob .std{font-size:13px}
  .prob h3{font:600 22px/1.25 var(--serif);color:var(--navy)}
  .impact{border-top:1px solid var(--rule)}
  .impact b{font:600 28px/1.1 var(--serif);color:var(--navy)}
  .wwh{gap:18px}
  .wwh p{font-size:14.5px;color:var(--ink-2)}
  .prev{background:var(--wash);border-left:3px solid var(--gold);padding:8px 14px;font-size:14px}
  .prev .lbl{color:var(--ink-3)}
  .total{background:var(--bar);color:var(--on-bar);border-bottom:3px solid var(--gold)}
  .total .lbl{color:#d3bd7c}
  .total p{color:#c9d3e2}
  .total .blank{border-color:rgba(255,255,255,.35)}
  .total b{font:600 46px/1 var(--serif)}
  .est-note{font-size:13px;color:var(--ink-3)}

  /* Before and after */
  .panel{border:1px solid var(--rule);border-top:2px solid var(--blue);background:var(--paper)}
  .panel.after{border-color:var(--rule);border-top-color:var(--gold);background:var(--wash)}
  .panel h3{font:600 21px/1.25 var(--serif);color:var(--navy)}
  .page-row,.panel.after .page-row{border-color:var(--rule);font-size:15px}
  .panel.after .page-row .n{color:var(--navy);font-weight:600}
  .ba .arrow span{border-color:var(--gold)}
  .ba-note{color:var(--ink-2)}

  /* Year-by-year table */
  table.track{min-width:640px}
  .track th,.track td{border-bottom-color:var(--rule)}
  .track thead th{font:600 22px/1 var(--serif);color:var(--navy)}
  .track thead th small{font:400 11.5px var(--sans);color:var(--ink-3)}
  .track thead th.now{color:var(--gold)}
  .track .rowh{font:600 13.5px/1.4 var(--sans);color:var(--navy);background:var(--paper)}
  .track tr.axis td:not(.rowh)::before{background:var(--rule)}
  .track tr.axis td:not(.rowh)::after{background:var(--gold)}
  .track tr.axis td.now::after{background:var(--paper);border:1px solid var(--gold)}
  .track tr.mile td{font:500 16px/1.35 var(--serif);color:var(--navy)}
  .track td.v{font-size:15px;color:var(--ink-2)}
  .track td.v.best{color:var(--navy)}
  .track td.v .bar{background:var(--gold-2)}
  .track td.v.best .bar{background:var(--navy)}
  .why{background:var(--wash);border-left:3px solid var(--gold);font-size:14px}
  .why b{font-weight:600;color:var(--navy)}
  .track-note{font-size:13px;color:var(--ink-3)}

  /* Priorities */
  .pri{grid-template-columns:64px 1fr;gap:24px;border-bottom:1px solid var(--rule)}
  .pri:first-of-type{border-top:2px solid var(--blue)}
  .pri .big{font:600 64px/.9 var(--serif);color:var(--gold)}
  .pri h3{font:600 24px/1.2 var(--serif);color:var(--navy)}
  .pri .pri-why{font-size:15.5px;color:var(--ink-2)}
  .pri-grid{grid-template-columns:1.4fr 1fr;gap:24px}
  .steps li{border-top:1px solid var(--rule);grid-template-columns:70px 1fr;font-size:14.5px}
  .steps li b{font:600 11px/1.6 var(--sans);letter-spacing:.1em;color:var(--navy)}
  .measure{border:1px solid var(--rule);border-top:2px solid var(--blue);background:var(--paper)}
  .measure b{font:600 30px/1.1 var(--serif);color:var(--navy)}
  .owner i{background:var(--bar);color:var(--on-bar);font:600 12px/30px var(--serif)}
  .owner b{font-weight:600;color:var(--navy)}
  .st{font:600 9.5px/1.4 var(--sans);letter-spacing:.1em;border-color:var(--rule);color:var(--ink-3)}
  .st.ok{border-color:var(--navy);color:var(--navy)}

  /* Stock chart and inventory table */
  .rw-row{grid-template-columns:150px 1fr 170px;gap:16px;border-bottom-color:var(--rule)}
  .rw-row.hd{border-bottom:2px solid var(--blue)}
  .rw-name{font:600 17px/1.25 var(--serif);color:var(--navy)}
  .rw-name small{font:400 12px var(--sans);color:var(--ink-3)}
  .lane .band{background:var(--wash);border-left-color:var(--rule);border-right-color:var(--rule)}
  .hd .lane .band span{font:600 8.5px/1.25 var(--sans);letter-spacing:.08em;color:var(--navy)}
  .hd .lane .mlab{font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--ink-3)}
  .lane .stock{background:var(--navy)}
  .lane .more{border-color:var(--navy)}
  .pill{font:600 9.5px/1.4 var(--sans);letter-spacing:.1em;border-color:var(--navy);color:var(--navy)}
  .pill.warn{background:var(--bar);border-color:var(--bar);color:var(--on-bar)}
  .pill.watch{border-color:var(--gold);color:var(--ink-2)}
  .rw-key{font-size:13px;color:var(--ink-3)}
  .rw-key .k1::before{background:var(--navy)}
  .rw-key .k3::before{background:var(--wash);border-color:var(--rule)}
  .rw-note,.inv-note{font-size:13px;color:var(--ink-3)}
  .inv-sub{font-size:16px;color:var(--ink-2)}
  table.inv{border-top:2px solid var(--blue)}
  .inv th{font:600 11px/1.3 var(--sans);letter-spacing:.1em;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-top:12px}
  .inv td{border-bottom-color:var(--rule)}
  .inv td.num{font:600 20px/1 var(--serif);color:var(--navy)}
  .inv .pname{font:600 17px/1.3 var(--serif);color:var(--navy)}
  .inv .asin{font:400 12px/1.3 var(--sans);letter-spacing:.06em;color:var(--gold)}

  /* Next 30 to 60 days */
  .work{border-top:2px solid var(--blue)}
  .work li{grid-template-columns:190px 1fr;border-bottom-color:var(--rule)}
  .work li::before{content:none}
  .work h3{font:600 19px/1.3 var(--serif);color:var(--navy)}
  .work p{font-size:15px;color:var(--ink-2)}

  /* Calendar */
  .cal::before{background:var(--gold-2)}
  .cal div::before{background:var(--gold)}
  .cal .d{font:600 11px/1.3 var(--sans);letter-spacing:.1em;color:var(--navy)}
  .cal p{font-size:14px;color:var(--ink-2)}

  /* About these numbers */
  .defs{border-top:2px solid var(--blue)}
  .defs p{border-bottom-color:var(--rule);font-size:14.5px;color:var(--ink-2)}
  .defs b{font:600 17px var(--serif);color:var(--navy)}

  /* Footer mark */
  footer{display:block;margin-top:48px;padding-top:0;border-top:none;text-align:center;font:400 15px/1.5 var(--serif);color:var(--ink-3)}
  footer::before{content:"";display:block;width:10px;height:10px;margin:0 auto 10px;background:var(--gold);transform:rotate(45deg)}
  footer .source{display:block;margin-top:4px;font:400 12px/1.5 var(--sans);letter-spacing:.06em;text-transform:uppercase}
  footer .source{text-transform:none;letter-spacing:.01em;font-size:13px}
  .sheet h2,.sheet h3,.sheet h4,.pname,.rw-name,.defs b,.track thead th,.track tr.mile td,.frame .lede,.story p,.brand .report{font-variant-numeric:lining-nums}

  @media (max-width:760px){
    .sec-h .aside{display:block}
  }
  @media (max-width:620px){
    body{background:var(--paper)}
    .sheet{padding:28px 0 40px}
    .brand{margin:-28px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 32px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-top:36px}
    .brand .logo{width:220px}
    .sec{margin-top:44px}
    .sec-h h2{font-size:23px}
    .frame{margin:0 6px 44px;padding:22px 16px}
    .frame .lede{font-size:19px}
    .counts div{padding:0 14px}
    .counts b{font-size:32px}
    .counts .hero b{font-size:40px}
    .total b{font-size:36px}
    .work li{grid-template-columns:1fr}
  }
</style>

  function $(id) { return document.getElementById(id); }
  function put(id, t) { $(id).innerHTML = v(t); }
  function num(x) { var n = parseFloat(String(x).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; }
  var STD = Number(R.merz && R.merz.standardDays) || 0;

  /* Header and summary */
  document.title = R.brand.pageTitle || R.brand.name || "What Merz handled for you";
  put("r-brand", R.brand.name);
  put("r-month", R.brand.reportMonth);
  $("r-since").innerHTML = "Partners since " + v(R.brand.partnerSince);
  put("r-lead", R.brand.accountLead);
  put("r-lede", R.summary.lede);
  $("r-counts").innerHTML =
    '<div class="hero"><span class="lbl">' + esc(R.summary.hero.label) + '</span><b class="n">' + v(R.summary.hero.value) + "</b></div>" +
    (R.summary.counts || []).map(function (c) {
      return '<div><span class="lbl">' + v(c.label) + '</span><b class="n">' + v(c.value) + "</b></div>";
    }).join("");

  /* Problems caught */
  var P = R.problems;
  put("r-prob-aside", P.aside);
  $("r-problems").innerHTML = (P.items || []).map(function (p) {
    var side = '<p class="date">' + v(p.dates) + "</p>" +
      '<p class="res">' + v(p.result) + (has(p.resultDetail) ? "<small>" + esc(p.resultDetail) + "</small>" : "") + "</p>" +
      (p.showStandard && STD ? '<p class="std">Merz standard: ' + STD + " days</p>" : "") +
      '<p class="impact"><span class="lbl">Estimated impact</span><b>' + v(p.impact && p.impact.value) + "</b><small>" + v(p.impact && p.impact.detail) + "</small></p>";
    return '<article class="prob"><div class="side">' + side + "</div><div>" +
      "<h3>" + v(p.title) + "</h3>" +
      '<div class="wwh">' +
        '<div><span class="lbl">What happened</span><p>' + v(p.happened) + "</p></div>" +
        '<div><span class="lbl">What it would have meant</span><p>' + v(p.meant) + "</p></div>" +
        '<div><span class="lbl">How we fixed it</span><p>' + v(p.fixed) + "</p></div>" +
      "</div>" +
      (p.showHistory ? '<p class="prev"><span class="lbl">' + v(p.history && p.history.label) + "</span><span>" + v(p.history && p.history.text) + "</span></p>" : "") +
      "</div></article>";
  }).join("");
  $("r-total-label").textContent = P.total.label || "";
  put("r-total-breakdown", P.total.breakdown);
  put("r-total-value", P.total.value);
  put("r-est-note", P.estimateNote);

  /* The story this month */
  var O = R.overview;
  put("r-story-title", O.title);
  put("r-story-sub", O.subtitle);
  $("r-kpis").innerHTML = (O.kpis || []).map(function (k) {
    return '<div><span class="lbl">' + v(k.label) + '</span><b class="n' + (has(k.value) ? "" : " empty") + '">' + v(k.value) + "</b></div>";
  }).join("");
  $("r-story").innerHTML = (O.paragraphs || []).map(function (p) { return "<p>" + v(p) + "</p>"; }).join("");

  /* Before and after */
  var B = R.beforeAfter;
  function panel(side, label, isAfter) {
    return '<div class="panel' + (isAfter ? " after" : "") + '"><span class="lbl"' + (isAfter ? ' style="color:var(--blue)"' : "") + ">" + label + "</span>" +
      "<h3>" + v(side.title) + "</h3>" +
      (side.rows || []).map(function (r) { return '<div class="page-row"><span>' + v(r.name) + '</span><span class="n">' + v(r.meta) + "</span></div>"; }).join("") +
      "</div>";
  }
  $("r-ba").innerHTML = panel(B.before, "Before", false) + '<div class="arrow" aria-hidden="true"><span></span></div>' + panel(B.after, "After", true);
  put("r-ba-date", B.date);
  put("r-ba-note", B.note);

  /* Year by year */
  var H = R.history, years = H.years || [], last = years.length - 1;
  $("r-hist-title").innerHTML = "Your account since " + v(years[0] && years[0].year);
  $("r-hist-head").innerHTML =
    '<tr><th class="rowh"></th>' + years.map(function (y, i) {
      return "<th" + (y.inProgress ? ' class="now"' : "") + ">" + v(y.year) + (has(y.note) ? "<small>" + esc(y.note) + "</small>" : "") + "</th>";
    }).join("") + "</tr>" +
    '<tr class="axis"><td class="rowh"></td>' + years.map(function (y) {
      return "<td" + (y.inProgress ? ' class="now"' : "") + "></td>";
    }).join("") + "</tr>";
  var body = '<tr class="mile"><th class="rowh">Milestone</th>' + years.map(function (y) { return "<td>" + v(y.milestone) + "</td>"; }).join("") + "</tr>";
  (H.rows || []).forEach(function (row) {
    var vals = row.values || [], nums = vals.map(num);
    var max = Math.max.apply(null, nums.filter(function (n) { return n != null; }).concat([0]));
    var sub = row.useStandard && STD ? "<small>Merz standard: " + STD + " days or fewer</small>" : "";
    body += '<tr><th class="rowh">' + esc(row.label) + sub + "</th>" + years.map(function (y, i) {
      var n = nums[i], cls = "v" + (i === last ? " best" : "");
      var bar = row.bars && n != null && n > 0 && max > 0
        ? (row.useStandard ? '<div class="meter"><div class="bar" style="width:' + Math.round(n / max * 100) + '%"></div></div>'
                           : '<div class="bar" style="width:' + Math.round(n / max * 100) + '%"></div>') : "";
      var met = "";
      if (row.useStandard && STD && n != null) {
        met = '<span class="met">' + (n > STD ? "Above standard" + (has(H.explain.text) ? "<sup>*</sup>" : "") : (n === STD ? "Meets standard" : "Beats standard")) + "</span>";
      }
      return '<td class="' + cls + '">' + v(vals[i]) + bar + met + "</td>";
    }).join("") + "</tr>";
  });
  $("r-hist-body").innerHTML = body;
  $("r-why-title").innerHTML = "* " + v(H.explain.title);
  $("r-why-text").innerHTML = v(H.explain.text);
  var cur = years.filter(function (y) { return y.inProgress; })[0];
  $("r-hist-note").innerHTML = (cur ? v(cur.year) + " is in progress. " : "") + esc(H.note || "");

  /* Number the sections */
  document.querySelectorAll("main .sec").forEach(function (sec, i) {
    var no = sec.querySelector(".no");
    if (no) no.textContent = ROMAN[i] + ".";
  });
})();
</script>
</body>
</html>
